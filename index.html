<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a6d4e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="北海道之旅">
<!-- 加到主畫面的圖示（這兩個 png 要跟 index.html 放在同一個資料夾） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<title>2026 有空來坐 北海道之旅！</title>
<meta name="description" content="2026/10/12–10/17 全家北海道行程：每日行程、天氣、日幣換算與準備清單">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ====== 顏色（想換色改這裡） ====== */
:root{
  --bg:#f7f2e9;        /* 米色底 */
  --card:#ffffff;
  --text:#3b342e;      /* 深咖啡字 */
  --muted:#8a7f72;
  --line:#e9e0d1;
  --green:#8cbf63;
  --green-soft:#edf4e3;
  --green-ink:#5b8a3a;
  --orange:#e0702f;    /* 重點橘 */
  --orange-soft:#fbeadf;
  --mustard-soft:#fbf1d8;
  --navy:#3d5a6c;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
html,body{max-width:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.7;letter-spacing:.02em;
  padding-bottom:calc(76px + var(--safe-b));overflow-x:hidden;
}
.view,.wrap,.timeline,.node,.spot,.ticket{min-width:0;max-width:100%}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
.appbar{
  position:relative;overflow:hidden;height:calc(140px + env(safe-area-inset-top,0px));
  background:
    radial-gradient(circle at 78% -20%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 45%),
    linear-gradient(180deg,#93cbe4 0%,#c3e3ef 70%,#e6f2f1 100%);
}
.appbar .inner{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 0}
.appbar .year{font-size:12px;font-weight:700;letter-spacing:.3em;color:#fff;opacity:.95}
.appbar h1{margin:2px 0 0;font-size:clamp(19px,6vw,24px);font-weight:900;line-height:1.3;color:#fff;letter-spacing:.06em;text-shadow:0 1px 10px rgba(50,110,140,.3)}
.appbar .count{
  display:inline-block;margin-top:8px;background:rgba(255,255,255,.85);color:var(--text);
  border-radius:999px;padding:1px 12px;font-size:13px;font-weight:700
}
.appbar svg.mtn{position:absolute;left:0;bottom:-1px;width:100%;height:56px;z-index:1}

/* ---------- 頁面切換 ---------- */
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-size:24px;font-weight:900;margin:18px 0 4px}
.page-sub{font-size:14px;color:var(--muted);margin:0 0 12px}

/* ---------- 底部 Tab ---------- */
.tabbar{
  position:fixed;z-index:50;left:0;right:0;bottom:0;
  display:flex;background:var(--navy);   /* 導覽列底色：深藍（和登機證同色） */
  box-shadow:0 -2px 12px rgba(40,50,60,.15);padding:6px 8px calc(6px + var(--safe-b))
}
.tabbar button{
  flex:1;max-width:140px;margin:0 auto;border:0;background:none;border-radius:14px;padding:7px 0 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:#b9cad4;
  font-size:11.5px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s
}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:#ffb07a;background:rgba(255,255,255,.1)}
.tabbar button:active{transform:scale(.95)}

/* ---------- 日期選單 ---------- */
.days{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(var(--bg) 82%,rgba(247,242,233,0))}
.days .pill{
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:#fff;border-radius:20px;
  box-shadow:0 3px 14px rgba(110,85,50,.07);padding:5px;max-width:560px;margin:0 16px
}
@media (min-width:592px){.days .pill{margin:0 auto}}
.days .pill::-webkit-scrollbar{display:none}
.days button{
  flex:1 1 0;min-width:0;border:0;background:none;border-radius:14px;padding:5px 2px;cursor:pointer;
  line-height:1.25;position:relative
}
.days b{display:block;font-size:clamp(13px,4.1vw,16px);font-weight:900;white-space:nowrap}
.days small{font-size:11px;color:var(--muted)}
.days button.on{background:var(--orange-soft)}
.days button.on b{color:var(--orange)}
.days .dot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--orange)}

/* ---------- 每日標題 ---------- */
.dayhead{margin:14px 0 12px}
.dayhead .no{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.dayhead h2{font-size:26px;font-weight:900;line-height:1.35;margin:0 0 6px}
.dayhead h2 em{font-style:normal;color:var(--orange)}
.dayhead .stay{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.dayhead .stay svg{width:16px;height:16px;flex:0 0 auto}

/* 每日天氣小條 */
.wxbar{
  display:flex;align-items:center;gap:12px;
  background:#fff;border-radius:18px;padding:10px 14px;margin:0 0 14px;box-shadow:0 2px 10px rgba(110,85,50,.05)
}
.wxbar .ic{font-size:28px;line-height:1}
.wxbar .t{flex:1;line-height:1.4}
.wxbar .t b{font-size:17px}
.wxbar .t span{display:block;font-size:13px;color:var(--muted)}
.wxbar .go{font-size:13px;color:var(--green-ink);font-weight:700;display:flex;align-items:center;gap:2px}
.wxbar .go svg{width:14px;height:14px}

/* ---------- 時間軸 ---------- */
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:10px;bottom:10px;border-left:2px dotted #d6c8b2}
.node{position:relative}
.node:before{
  content:"";position:absolute;left:-20px;top:22px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3px solid var(--green)
}
.node.hotel:before{border-color:#a99ad6}
.node.flight:before{border-color:var(--orange)}

.spot{
  display:flex;gap:13px;background:var(--card);border-radius:20px;padding:11px;
  box-shadow:0 2px 12px rgba(110,85,50,.06);margin:9px 0
}
.thumb{flex:0 0 92px;height:92px;border-radius:14px;overflow:hidden;background:#ece5d8}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.icon{display:flex;align-items:center;justify-content:center;background:#efebf8}
.thumb.icon svg{width:40px;height:40px;color:#8f7fc6}
.info{flex:1;min-width:0}
.info .time{font-size:12.5px;color:var(--orange);font-weight:700;letter-spacing:.03em}
.info .top{display:flex;align-items:flex-start;gap:8px}
.info h3{flex:1;margin:0;font-size:18px;font-weight:900;line-height:1.4}
.info p{margin:3px 0 0;font-size:14.5px;color:#625649;line-height:1.65}
.info .tip{margin-top:5px;font-size:13px;color:var(--muted);display:flex;gap:4px}
.info .tip:before{content:"ⓘ";color:var(--orange)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#b5652c;background:var(--orange-soft);border-radius:6px;padding:0 6px;vertical-align:3px;margin-left:4px;letter-spacing:0;line-height:1.7}
.icon-btn{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--green-soft);color:var(--green-ink);text-decoration:none
}
.icon-btn svg{width:18px;height:18px}

/* 點擊展開介紹 */
.spot.fold{cursor:pointer;position:relative}
.spot.fold .more{display:none}
.spot.fold.open .more{display:block;animation:fade .2s ease}
.peek{position:absolute;right:20px;bottom:10px;display:flex;color:var(--muted)}
.peek svg{width:18px;height:18px;transition:transform .2s}
.spot.fold.open .info{padding-bottom:16px}
.spot.fold.open .peek svg{transform:rotate(180deg)}

/* ---------- 地圖 ---------- */
.mapcard{position:relative;background:#7cc3c8;border-radius:22px;overflow:hidden;margin:10px 0 14px;box-shadow:0 2px 12px rgba(110,85,50,.08)}
.mapcard svg{display:block;width:100%;height:auto}
.mapcard .cap{position:absolute;right:12px;bottom:8px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.05em;opacity:.95}

/* 第二層：移動、用餐 */
.sub{margin:0;font-size:14px;color:var(--muted)}
.sub summary,.sub>a{
  list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:7px 4px;
  text-decoration:none;color:var(--muted)
}
.sub summary::-webkit-details-marker{display:none}
.sub svg.i{width:17px;height:17px;flex:0 0 auto}
.sub .lbl{color:var(--text);font-weight:700}
.sub .chev{width:14px;height:14px;transition:transform .2s;margin-left:auto;flex:0 0 auto}
.sub[open] .chev{transform:rotate(180deg)}
.sub .opts{margin:0 4px 8px 25px;padding:8px 12px;border-left:2px solid var(--line);background:rgba(255,255,255,.65);border-radius:0 12px 12px 0}
.sub .opt+.opt{margin-top:8px}
.sub .opt b{color:var(--text)}
.sub .opt .rec{font-size:11px;background:var(--green);color:#fff;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:2px}
.meal .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--green-ink);font-weight:700}
.meal .go svg{width:14px;height:14px}
.note{font-size:13.5px;color:#6d6154;margin:8px 0;padding:8px 12px;background:var(--mustard-soft);border-radius:12px}

/* ---------- 登機證 ---------- */
.ticket{position:relative;background:#fff;border-radius:18px;margin:9px 0;overflow:hidden;box-shadow:0 3px 14px rgba(110,85,50,.1)}
.ticket .band{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:7px 16px;font-size:11px;letter-spacing:.18em;font-weight:700}
.ticket .band b{font-size:13px;letter-spacing:.06em}
.ticket .main{padding:12px 16px 14px}
.route{display:flex;align-items:center;justify-content:space-between}
.route .ap b{display:block;font-size:clamp(26px,8vw,34px);font-weight:900;letter-spacing:.03em;line-height:1.1;color:var(--navy)}
.route .ap span{font-size:12px;color:var(--muted)}
.route .ap.r{text-align:right}
.route .mid{flex:1;min-width:0;display:flex;align-items:center;gap:6px;margin:0 10px}
.route .mid i{flex:1;border-top:2px dashed #ddd0bb}
.route .mid svg{width:22px;height:22px;color:var(--orange)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.fields div{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.fields b{display:block;font-size:clamp(13px,4vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);letter-spacing:0}
.perf{position:relative;border-top:2px dashed #e4d9c6;margin:0 14px}
.perf:before,.perf:after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.perf:before{left:-26px}.perf:after{right:-26px}
.stub{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px 11px}
.stub .code{font-size:12px;color:var(--muted)}
.stub .code b{font-size:15px;color:var(--text)}
.barcode{flex:0 0 110px;height:30px;opacity:.75;background:repeating-linear-gradient(90deg,#3b342e 0 2px,transparent 2px 4px,#3b342e 4px 5px,transparent 5px 8px,#3b342e 8px 11px,transparent 11px 12px)}

.mini{display:flex;background:#fff;border-radius:16px;margin:9px 0;overflow:hidden;box-shadow:0 2px 12px rgba(110,85,50,.07)}
.mini-l{flex:0 0 64px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative}
.mini-l svg{width:20px;height:20px;color:#fff}
.mini-l:after{content:"";position:absolute;right:-1px;top:6px;bottom:6px;border-right:2px dashed #fff}
.mini-r{flex:1;min-width:0;padding:9px 12px}
.mini-route{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap}
.mini-route b{font-size:18px;font-weight:900;color:var(--navy)}
.mini-route i{flex:1;min-width:10px;border-top:2px dashed #ddd0bb}
.mini-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 總覽 ---------- */
.section{margin-top:22px}
.section h2{font-size:19px;font-weight:900;margin:0 0 6px;display:flex;align-items:center}
.section h2:after{content:"";flex:1;border-top:1px dashed var(--line);margin-left:10px}
.ov{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.ov .d{flex:0 0 58px;font-weight:900;color:var(--orange)}
.ov .t{flex:1}
.ov svg{width:16px;height:16px;color:var(--muted)}

/* ---------- 天氣頁 ---------- */
.wxcard{background:#fff;border-radius:20px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 12px rgba(110,85,50,.06)}
.wxcard.today{outline:2px solid var(--orange)}
.wxcard .row{display:flex;align-items:center;gap:12px}
.wxcard .ic{font-size:38px;line-height:1}
.wxcard .d{font-size:13px;color:var(--muted)}
.wxcard .d b{color:var(--text);font-size:15px;margin-right:4px}
.wxcard .tmp{font-size:24px;font-weight:900;line-height:1.25}
.wxcard .desc{font-size:13px;color:var(--muted)}
.wxcard .wear{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.wxcard .wear .h{font-size:13px;font-weight:700;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--green-soft);border-radius:999px;padding:2px 11px;font-size:13.5px}
.auto{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* ---------- 工具頁 ---------- */
.tool{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(110,85,50,.06)}
.tool h3{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.tool summary{list-style:none;cursor:pointer}
.tool summary::-webkit-details-marker{display:none}
.tool .tchev{width:18px;height:18px;color:var(--muted);transition:transform .2s;margin-left:6px}
.tool[open] .tchev{transform:rotate(180deg)}
.tool .tbody{margin-top:12px}
.tool h3 small{margin-left:auto;font-weight:500;font-size:12px;font-weight:500;color:var(--muted)}
.tool h3 svg{width:22px;height:22px;color:var(--orange)}
.fx-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px 14px}
.fx-row .cur{font-weight:900;font-size:15px;min-width:42px;color:var(--muted)}
.fx-row input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:28px;font-weight:900;color:var(--text);text-align:right;outline:none}
.fx-out{font-size:28px;font-weight:900;text-align:right;flex:1;color:var(--orange)}
.fx-swap{display:flex;justify-content:center;margin:-4px 0}
.fx-swap button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:var(--orange-soft);color:var(--orange);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.fx-swap svg{width:18px;height:18px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{border:0;background:var(--green-soft);color:var(--green-ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;cursor:pointer}
.fx-rate{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}

.check label{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.pgroup{font-size:12.5px;font-weight:700;color:var(--orange);letter-spacing:.08em;margin:14px 0 0}
.pgroup:first-child{margin-top:4px}
.check input{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--green)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}

.gift-form{display:flex;gap:6px;flex-wrap:wrap}
.gift-form input{flex:1 1 120px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font:inherit;font-size:15px;outline:none}
.gift-form input:focus{border-color:var(--orange)}
.gift-form input:first-child{flex-basis:100%}
.gift-form input+input{flex:1 1 0}
.gift-form button{border:0;background:var(--orange);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer}
.gifts{margin-top:8px}
.gift{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.gift:last-child{border-bottom:0}
.gift input{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
.gift .g{flex:1;line-height:1.4}
.gift .g small{display:block;color:var(--muted);font-size:12.5px}
.gift.done .g b{color:var(--muted);text-decoration:line-through}
.gift .del{border:0;background:none;color:#c2b6a6;font-size:20px;cursor:pointer;padding:0 6px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0 4px}
.local{font-size:12px;color:var(--muted);margin-top:8px}

.foot{margin:30px 0 0;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<!-- ====== Header ====== -->
<header class="appbar">
  <div class="inner">
    <div class="year">2026 HOKKAIDO</div>
    <h1>有空來坐 北海道之旅！</h1>
    <div class="count" id="countdown"></div>
  </div>
  <svg class="mtn" viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 L40 16 L70 24 L110 8 L150 24 L200 14 L245 26 L292 6 L335 22 L372 12 L400 18 V56 H0Z" fill="#b9d3dc" opacity=".9"/>
    <path d="M0 56 V32 L30 18 L55 30 L88 14 L126 40 L150 56Z" fill="#7fb24f"/>
    <path d="M0 56 V44 L30 18 L42 40 L70 28 L96 50 L108 56Z" fill="#b5d97a"/>
    <path d="M232 56 L268 34 L294 42 L330 16 L362 32 L390 18 L400 22 V56Z" fill="#7fb24f"/>
    <path d="M262 56 L294 42 L310 50 L330 16 L346 46 L374 34 L400 44 V56Z" fill="#b5d97a"/>
    <path d="M0 56 V50 Q100 44 200 49 T400 47 V56Z" fill="#f7f2e9"/>
  </svg>
</header>

<!-- ====== 行程總覽 ====== -->
<section class="view" id="view-overview">
  <div class="wrap" id="ovbox"></div>
</section>

<!-- ====== 每日行程 ====== -->
<section class="view" id="view-trip">
  <nav class="days" aria-label="選擇日期"><div class="pill" id="daynav"></div></nav>
  <div class="wrap" id="tripbox"></div>
</section>

<!-- ====== 天氣 ====== -->
<section class="view" id="view-weather">
  <div class="wrap">
    <h2 class="page-title">天氣</h2>
    <p class="page-sub">每天去的地方天氣不一樣</p>
    <div id="wxlist"></div>
    <div class="auto">每日自動更新</div>
  </div>
</section>

<!-- ====== 工具 ====== -->
<section class="view" id="view-tools">
  <div class="wrap">
    <h2 class="page-title">工具</h2>

    <details class="tool" id="fx" open>

const wxCache = {};
function getWeather(d){
  const w = d.weather, key = d.date + "|" + w.lat;
  if (!wxCache[key]){
    wxCache[key] = fetch("https://api.open-meteo.com/v1/forecast?latitude="+w.lat+"&longitude="+w.lon+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max" +
      "&timezone=Asia%2FTokyo&start_date="+d.date+"&end_date="+d.date)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const x = j && j.daily;
        if (!x || x.temperature_2m_max[0] == null) return null;
        const max = x.temperature_2m_max[0], min = x.temperature_2m_min[0];
        const rain = x.precipitation_probability_max[0] ?? 0, wind = x.wind_speed_10m_max[0] ?? 0;
        const [icon, desc] = WX[x.weather_code[0]] || ["🌡️",""];
        return { icon, desc, max, min, rain, wind, wear: wear(max,min,rain,wind) };
      })
      .catch(() => null);
  }
  return wxCache[key];
}
function wear(max, min, rain, wind){
  const a = [];
  if (min < 5) a.push("發熱衣","保暖外套","圍巾手套");
  else if (min < 10) a.push("長袖","薄羽絨／保暖外套");
  else if (min < 15) a.push("長袖","薄外套");
  else a.push("短袖或薄長袖","備一件薄外套");
  if (max - min >= 8) a.push("早晚溫差大");
  if (rain >= 50) a.push("一定帶傘","防水的鞋");
  else if (rain >= 25) a.push("帶折疊傘");
  if (wind >= 25) a.push("防風外套","帽子");
  return a;
}

function dayMap(d){
  if (!d.route || !d.route.length) return "";
  const ps = d.route.map(k => PLACES[k]), K = Math.cos(43*Math.PI/180), W = 400, H = 260;
  const la0 = Math.min(...ps.map(p=>p.lat)), la1 = Math.max(...ps.map(p=>p.lat));
  const lo0 = Math.min(...ps.map(p=>p.lon)), lo1 = Math.max(...ps.map(p=>p.lon));
  /* 預留名字的空間，再算放大倍率（最多放大到約 25 公里高） */
  const lw = p => p.name.length*16 + 24;
  const padL = Math.max(18, ...ps.filter(p=>p.pos==="l").map(lw)), padR = Math.max(18, ...ps.filter(p=>p.pos!=="l").map(lw));
  const padT = 42, padB = ps.some(p=>p.pos==="b") ? 34 : 26;
  const s = Math.min((W-padL-padR)/Math.max((lo1-lo0)*K,1e-6), (H-padT-padB)/Math.max(la1-la0,1e-6), H/0.24);
  const offX = padL + ((W-padL-padR) - (lo1-lo0)*K*s)/2, offY = padT + ((H-padT-padB) - (la1-la0)*s)/2;
  const v = { lon0: lo0 - offX/(K*s), lat1: la1 + offY/s };
  const P = (la,lo) => [(lo - v.lon0)*K*s, (v.lat1 - la)*s];
  const land = COAST.map(r => { let o = ""; for (let i = 0; i < r.length; i += 2){ const [x,y] = P(r[i+1], r[i]); o += (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); } return o+"Z"; }).join("");
  const km = s/111;   /* 每公里幾個點 */
  let g = '<rect width="'+W+'" height="'+H+'" fill="#7cc3c8"/>' +
    '<path d="'+land+'" fill="#a9dcd6" stroke="#a9dcd6" stroke-width="14" stroke-linejoin="round"/>' +
    '<path d="'+land+'" fill="#fbf3df" stroke="#f1e3c3" stroke-width="1"/>';
  const lake = (la,lo,rx,ry,n) => { const [x,y] = P(la,lo); return '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="'+(rx*km).toFixed(1)+'" ry="'+(ry*km).toFixed(1)+'" fill="#7cc3c8"/>' +
    (y+ry*km+14 < H-24 ? '<text x="'+x.toFixed(1)+'" y="'+(y+ry*km+12).toFixed(1)+'" font-size="10" fill="#8a9aa3" text-anchor="middle">'+n+'</text>' : ''); };
  g += lake(42.60,140.85,4.6,4.2,"洞爺湖") + lake(42.765,141.33,6.5,3.6,"支笏湖");
  const [yx,yy] = P(42.826,140.811);
  g += deco.mtn(yx.toFixed(0), yy.toFixed(0), .9) + '<text x="'+yx.toFixed(1)+'" y="'+(yy+12).toFixed(1)+'" font-size="10" fill="#8a9aa3" text-anchor="middle">羊蹄山</text>';
  const xy = ps.map(p => P(p.lat, p.lon));
  const seen = {};
  for (let i = 1; i < xy.length; i++){
    const [x1,y1] = xy[i-1], [x2,y2] = xy[i], a = d.route[i-1], b = d.route[i];
    if (a === b || seen[b+">"+a]) continue;   /* 去回同一條路只畫一次 */
    seen[a+">"+b] = 1;
    let ox = -(y2-y1)*.08, oy = (x2-x1)*.08;
    if (oy < 0){ ox = -ox; oy = -oy; }   /* 弧線一律往南（內陸）彎，避免畫到海上 */
    const mx = (x1+x2)/2 + ox, my = (y1+y2)/2 + oy;
    g += '<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+'Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="#e0702f" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 6"/>';
  }
  const uniq = [...new Set(d.route)];
  g += uniq.map(k => { const p = PLACES[k], [x,y] = P(p.lat,p.lon); return mapPin(x, y, p.stay ? "#9a86d0" : "#e0702f"); }).join("");
  g += uniq.map(k => { const p = PLACES[k], [x,y] = P(p.lat,p.lon); return mapLabel(x, y, p.pos, p.name, "", 15); }).join("");
  /* 比例尺 */
  const L = [5,10,20,50].find(n => n*km >= 40) || 50;
  g += '<g transform="translate('+(W-14)+' '+(H-12)+')"><path d="M0 0H'+(-L*km).toFixed(1)+'" stroke="#6d6154" stroke-width="3" stroke-linecap="round"/>' +
    '<text x="0" y="-6" text-anchor="end" font-size="11" font-weight="700" fill="#6d6154" stroke="#fff" stroke-width="3" paint-order="stroke">示意圖・'+L+' 公里</text></g>';
  return '<div class="mapcard"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="今天的路線地圖">'+g+'</svg></div>';
}

function renderItem(it){
  switch(it.type){
    case "spot":
      return '<div class="node"><article class="spot fold">' +
        '<div class="thumb"><img loading="lazy" src="'+esc(it.photo)+'" alt="'+esc(it.name)+'"></div>' +
        '<div class="info">'+(it.time?'<div class="time">'+esc(it.time)+'</div>':"") +
          '<div class="top"><h3>'+esc(it.name)+pend(it.pending)+'</h3>'+(it.map?mapBtn(it.map):"")+'</div>' +
          '<div class="more"><p>'+esc(it.intro)+'</p>' + (it.tips||[]).map(t=>'<div class="tip">'+esc(t)+'</div>').join("") + '</div>' +
          '<span class="peek" aria-hidden="true">'+ICON.chevS+'</span>' +
        '</div></article></div>';
    case "hotel": {
      const h = HOTELS[it.hotel];
      return '<div class="node hotel"><article class="spot">'+hotelThumb(h)+'' +
        '<div class="info"><div class="time">'+esc(it.time||"")+'　'+esc(it.action)+'</div>' +
        '<div class="top"><h3>'+esc(h.name)+pend(h.pending)+'</h3>'+mapBtn(h.map)+'</div></div></article></div>';
    }
    case "flight":
      return '<div class="node flight">'+miniTicket(FLIGHTS[it.flight])+'</div>';
    case "move":
      return '<details class="sub"><summary>'+ICON.train+'<span class="lbl">移動</span><span>'+(it.time?esc(it.time)+"・":"")+esc(it.to)+'</span>'+ICON.chev+'</summary>' +
        '<div class="opts">'+it.options.map(o=>'<div class="opt"><b>'+esc(o.title)+'</b>'+(o.rec?'<span class="rec">建議</span>':"")+'<br>'+esc(o.detail)+'</div>').join("")+'</div></details>';
    case "meal":
      return '<div class="sub meal"><a href="'+nearUrl(it.near)+'" target="_blank" rel="noopener">'+ICON.food+'<span class="lbl">'+esc(it.label)+'</span><span class="go">附近餐廳'+ICON.arrow+'</span></a></div>';
    case "note":
      return '<div class="note">'+esc(it.text)+'</div>';

  return "";
}

const dayNav = $("#daynav"), trip = $("#tripbox");

function renderWeather(focus){
  const list = $("#wxlist");
  list.innerHTML = DAYS.map((d,i)=>'<div class="wxcard'+(d.date===today?" today":"")+'" id="wx'+i+'">' +
    '<div class="row"><div class="ic">⏳</div><div><div class="d"><b>'+esc(d.short)+'（'+esc(d.week)+'）</b>'+esc(d.weather.name)+'</div>' +
    '<div class="tmp">讀取中…</div></div></div></div>').join("");
  DAYS.forEach((d,i)=>getWeather(d).then(w=>{
    w = w || WX_FALLBACK(d.weather.name);
    const el = $("#wx"+i); if (!el) return;
    el.innerHTML = '<div class="row"><div class="ic">'+w.icon+'</div><div>' +
      '<div class="d"><b>'+esc(d.short)+'（'+esc(d.week)+'）</b>'+esc(d.weather.name)+'</div>' +
      '<div class="tmp">'+(w.fallback ? w.range : Math.round(w.min)+'° – '+Math.round(w.max)+'°C')+'</div>' +
      '<div class="desc">'+(w.fallback ? "往年這時候・"+w.desc : esc(w.desc)+'・降雨機率 '+w.rain+'%')+'</div></div></div>' +
      '<div class="wear"><div class="h">這天這樣穿</div><div class="chips">'+w.wear.map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div></div>';
  }));
  if (focus != null) setTimeout(()=>{ const el = $("#wx"+focus); if (el) el.scrollIntoView({block:"center"}); }, 60);
}

/* ---------- 工具頁：日幣換算 ---------- */
let fxRate = store.get("hk-fx", null), fxDir = "jpy";
function fxRender(){
  const v = parseFloat($("#fxIn").value) || 0, r = (fxRate && fxRate.rate) || FX_FALLBACK;
  const out = fxDir === "jpy" ? v * r : v / r;
  $("#fxOut").textContent = out.toLocaleString("zh-TW", {maximumFractionDigits: fxDir === "jpy" ? 0 : 0});
  $("#fxFromCur").textContent = fxDir === "jpy" ? "日圓" : "台幣";
  $("#fxToCur").textContent = fxDir === "jpy" ? "台幣" : "日圓";
  $("#fxRate").textContent = "1 日圓 ≈ " + r.toFixed(4) + " 台幣・" + (fxRate ? "每日自動更新" : "參考匯率");
  const q = fxDir === "jpy" ? [100,500,1000,3000,5000,10000] : [100,500,1000,3000];
  $("#fxQuick").innerHTML = q.map(n=>'<button data-v="'+n+'">'+(fxDir==="jpy"?"¥":"NT$")+n.toLocaleString()+'</button>').join("");
  $("#fxQuick").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("#fxIn").value = b.dataset.v; fxRender(); });
}
$("#fxIn").oninput = fxRender;
$("#fxSwap").onclick = () => { fxDir = fxDir === "jpy" ? "twd" : "jpy"; $("#fxIn").value = ""; fxRender(); };
if (!fxRate || fxRate.day !== today){
  fetch("https://open.er-api.com/v6/latest/JPY").then(r=>r.json()).then(j=>{
    if (j && j.rates && j.rates.TWD){ fxRate = { rate:j.rates.TWD, day:today }; store.set("hk-fx", fxRate); fxRender(); }
  }).catch(()=>{});
}

/* ---------- 工具頁：準備清單 ---------- */
/* 舊版清單的順序（用來把舊的打勾紀錄搬過來，可以不用理它） */
const PACKING_OLD = ["護照","日幣現金＋信用卡","手機網路（網卡或 eSIM）","好走的鞋（每天會走不少路）","洋蔥式衣物：短袖、長袖、薄外套","保暖外套、圍巾、帽子","折疊傘","常用藥品","手機充電器、行動電源（只能放隨身行李）","小毛巾（泡足湯用）","日本插座和台灣一樣，不用轉接頭"];
function renderPack(){
  const KEY = "hk2026-pack-v2", all = PACKING.flatMap(g => g.items);
  if (store.get(KEY, null) == null){
    const old = store.get("hk2026-pack", {}), s = {};
    PACKING_OLD.forEach((t,i) => { if (old[i]) s[t] = true; });
    store.set(KEY, s);
  }
  const saved = store.get(KEY, {});
  $("#pack").innerHTML = PACKING.map(g => '<div class="pgroup">'+esc(g.group)+'</div>' +
    g.items.map(t => '<label><input type="checkbox" data-t="'+esc(t)+'"'+(saved[t]?" checked":"")+'><span>'+esc(t)+'</span></label>').join("")).join("");
  const update = () => {
    const s = store.get(KEY, {}), n = all.filter(t => s[t]).length;
    $("#packCount").textContent = n + " / " + all.length;
    $("#packBar").style.width = (n / all.length * 100) + "%";
  };
  $("#pack").querySelectorAll("input").forEach(el=>el.onchange=()=>{
    const s = store.get(KEY, {}); s[el.dataset.t] = el.checked; store.set(KEY, s); update();
  });
  update();
}

/* ---------- 工具頁：伴手禮、購物清單 ---------- */
function setupList(id, key, emptyText, subPrefix){
  const render = () => {
    const list = store.get(key, []), box = $("#"+id+"List");
    $("#"+id+"Count").textContent = list.length ? list.filter(g=>g.done).length + " / " + list.length : "";
    box.innerHTML = list.length ? list.map((g,i)=>'<div class="gift'+(g.done?" done":"")+'">' +
        '<input type="checkbox" data-i="'+i+'"'+(g.done?" checked":"")+' aria-label="已買">' +
        '<div class="g"><b>'+esc(g.name)+'</b>'+(g.who?'<small>'+subPrefix+esc(g.who)+'</small>':"")+'</div>' +
        '<button class="del" data-del="'+i+'" aria-label="刪除">×</button></div>').join("")
      : '<div class="empty">'+emptyText+'</div>';
    box.querySelectorAll("input").forEach(el=>el.onchange=()=>{
      const l = store.get(key, []); l[el.dataset.i].done = el.checked; store.set(key, l); render();
    });
    box.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{
      const l = store.get(key, []); l.splice(+el.dataset.del, 1); store.set(key, l); render();
    });
  };
  $("#"+id+"Form").onsubmit = e => {
    e.preventDefault();
    const name = $("#"+id+"Name").value.trim(); if (!name) return;
    const l = store.get(key, []); l.push({ name, who:$("#"+id+"Who").value.trim(), done:false });
    store.set(key, l); $("#"+id+"Name").value = ""; $("#"+id+"Who").value = ""; render();
  };
  render();
}

/* ---------- 底部 Tab 切換 ---------- */
const tabs = document.querySelectorAll(".tabbar button");
function switchTab(name, focusDay){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id === "view-"+name));
  tabs.forEach(b=>b.classList.toggle("on", b.dataset.tab === name));
  if (name === "weather") renderWeather(focusDay);
  if (name === "overview"){
    $("#ovbox").innerHTML = '<h2 class="page-title">行程總覽</h2>' + renderOverview();
    $("#ovbox").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ showDay(+el.dataset.go); switchTab("trip"); });
  }
  if (focusDay == null) window.scrollTo(0,0);
}
tabs.forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ---------- 啟動 ---------- */
fxRender(); renderPack();
setupList("gift", "hk-gifts", "還沒有記錄，看到想買的就記下來吧！", "給 ");
setupList("shop", "hk-shop", "把自己想買的東西記在這裡", "");
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
const ti = DAYS.findIndex(d=>d.date===today);
showDay(ti >= 0 ? ti : 0);
/* 一打開永遠是「行程總覽」的最上面；清掉網址後面的 #xxx，避免瀏覽器自己跳到頁面中間 */
if (location.hash){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }
switchTab("overview");
window.scrollTo(0,0);
window.addEventListener("load", () => window.scrollTo(0,0));
window.addEventListener("pageshow", () => { if (document.querySelector("#view-overview.on")) window.scrollTo(0,0); });
</script>
